name: Build iOS IPA

on:
  push:
    branches:
      - master
      - endless-development
  pull_request:
    branches:
      - master
      - endless-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Shattered Pixel Dungeon Endless IPA
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and install RoboVM app bundle
        run: ./gradlew :ios:build :ios:robovmInstall --no-daemon --stacktrace --info

      - name: Package RoboVM output as unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="ios/build/robovm"
          APP_NAME="Shattered Pixel Dungeon"
          APP_BUNDLE="$RUNNER_TEMP/ipa-package/Payload/$APP_NAME.app"
          IPA_PATH="$BUILD_DIR/Shattered-Pixel-Dungeon-Endless.ipa"

          # RoboVM's install task writes the .app bundle contents directly
          # into ios/build/robovm rather than creating a directory ending in .app.
          test -f "$BUILD_DIR/Info.plist"
          test -x "$BUILD_DIR/IOSLauncher"
          test -d "$BUILD_DIR/Frameworks"

          rm -rf "$RUNNER_TEMP/ipa-package"
          mkdir -p "$(dirname "$APP_BUNDLE")"
          ditto "$BUILD_DIR" "$APP_BUNDLE"

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_BUNDLE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_BUNDLE/Info.plist"
          /usr/bin/plutil -lint "$APP_BUNDLE/Info.plist"
          test -x "$APP_BUNDLE/IOSLauncher"
          test -d "$APP_BUNDLE/Frameworks"

          rm -f "$IPA_PATH"
          (cd "$RUNNER_TEMP/ipa-package" && /usr/bin/zip -qry "$IPA_PATH" Payload)

          /usr/bin/unzip -t "$IPA_PATH"
          test -s "$IPA_PATH"
          echo "Created unsigned IPA: $IPA_PATH"
          /bin/ls -lh "$IPA_PATH"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Pixel-Dungeon-Endless-iOS-IPA
          path: ios/build/robovm/Shattered-Pixel-Dungeon-Endless.ipa
          if-no-files-found: error
          retention-days: 14
