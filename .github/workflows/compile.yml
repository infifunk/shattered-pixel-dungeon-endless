name: Build iOS IPA

on:
  push:
    branches:
      - master
      - endless-development
  pull_request:
    branches:
      - master
      - endless-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Shattered Pixel Dungeon Endless IPA
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build iOS IPA
        run: ./gradlew :ios:createIPA --no-daemon --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Pixel-Dungeon-Endless-iOS-IPA
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
          retention-days: 14
